[build-system]
requires = ["setuptools>=68,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "democrai"
version = "0.0.1b2"
description = "A Python framework for building agentic AI applications with server-driven UI, observability, and sandboxed extensibility."
readme = "democrai/README_PYPI.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Democr.ai", email = "development@democr.ai" },
]
license = "AGPL-3.0-only AND Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "aiohttp>=3.14,<4",
    "alembic>=1.18,<2",
    "boto3>=1.43,<2",
    "clickhouse-connect>=1.1,<2",
    "cryptography>=48,<49",
    "fastapi>=0.136,<1",
    "filelock>=3.29,<4",
    "filetype>=1.2,<2",
    "grpcio>=1.80,<1.82",
    "grpcio-health-checking>=1.80,<1.82",
    "protobuf>=6.31.1,<7",
    "httpx>=0.28,<0.29",
    "jsonpath-ng>=1.8,<2",
    "jsonschema>=4.26,<5",
    "ladybug>=0.17,<1",
    "neo4j>=6.2,<7",
    "numpy>=2.2,<3",
    "nvidia-ml-py>=13.610,<14",
    "opentelemetry-exporter-otlp>=1.42,<1.43",
    "opentelemetry-sdk>=1.42,<1.43",
    "pandas>=3.0,<4",
    "pillow>=12.2,<13",
    "psutil>=7.2,<8",
    "psycopg2-binary>=2.9,<3",
    "py-bcrypt==0.4",
    "pydantic>=2.13,<3",
    "pymilvus>=3.0,<4",
    "pypdfium2>=5.9,<6",
    "PyJWT>=2.13,<3",
    "python-magic>=0.4,<0.5; sys_platform != 'win32'",
    "python-magic-bin>=0.4,<0.5; sys_platform == 'win32'",
    "python-multipart>=0.0.30,<0.1",
    "pyyaml>=6.0,<7",
    "qrcode>=8.2,<9",
    "redis>=8,<9",
    "apsw>=3.53.1.0,<3.54",
    "sqlite-vec>=0.1.9,<0.2",
    "sqliteai-vector>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "supervision>=0.28,<0.29",
    "uv>=0.11,<0.12",
    "uvicorn>=0.48,<0.49",
    "websockets>=16,<17",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.11,<6.12",
    "pyqtgraph>=0.14,<0.15",
    "qtawesome>=1.4,<2",
]
dev = [
    "grpcio-tools>=1.80,<1.82",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7,<8",
    "watchfiles>=1.2,<2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocs-mermaid2-plugin>=1.2,<2",
    "mkdocs-shadcn>=0.10,<0.11",
]
hot-reload = [
    "watchfiles>=1.2,<2",
]
all = [
    "democrai[desktop,dev,docs,hot-reload]",
]

[project.urls]
Homepage = "https://democr.ai"
Documentation = "https://democr.ai/docs/"
Repository = "https://github.com/democr-ai/democrai"

[project.scripts]
democrai = "democrai.core.runtime.launcher:main"
democrai-os-sandbox-helper = "democrai.core.infrastructure.sandbox.os.helper_entrypoint:main"

[tool.setuptools.packages.find]
include = ["democrai*"]

[tool.setuptools.package-data]
"democrai" = [
    "config.example.yaml",
    "config.distributed.example.yaml",
    "core/LICENSE",
    "sdk/LICENSE",
    "core/application/locales/*.json",
    "core/application/ai/chat_templates/templates/*.jinja",
    "core/application/ai/engine/orchestrator/proto/*.proto",
    "core/application/knowledge/query/proto/*.proto",
    "core/application/runtime_prompt/grpc/proto/*.proto",
    "core/infrastructure/**/alembic.ini",
    "core/infrastructure/**/migrations/*.py",
    "core/infrastructure/**/migrations/script.py.mako",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
follow_imports = "silent"
pretty = true
show_error_codes = true
warn_unused_ignores = true
