      show_if:
        conditions:
          - left: {type: store, scope: page, path: /engine_model_test/tests_available, default: false}
            op: "=="
            right: true
      children:
        - kind: Column
          id: engine_model_test_result_body
          spacing: 8
          children:
            - kind: Title
              id: engine_model_test_result_title
              text: "@t/system.engine.model.test.result_title"
              level: 4
            - kind: Column
              id: engine_model_test_generate_completion_result
              spacing: 8
              children: []
    - kind: Text
      id: engine_model_detail_invalid
      text: "@state/page/engine_model_test/summary"
      show_if:
        conditions:
          - left: {type: store, scope: page, path: /engine_model_test/valid, default: false}
            op: "=="
            right: false
