- kind: Column
  id: engine_model_detail_page
  spacing: 14
  children:
    - kind: Breadcrumb
      id: engine_model_detail_breadcrumb
      segments: "@state/page/engine_model_test/breadcrumb_segments"
    - kind: Card
      id: engine_model_detail_summary_card
      variant: elevated
      padding: [18, 18, 18, 18]
      style: "margin-top: 12px;"
      show_if:
        conditions:
          - left: {type: store, scope: page, path: /engine_model_test/valid, default: false}
            op: "=="
            right: true
      children:
        - kind: Column
          id: engine_model_detail_summary_body
          spacing: 14
          children:
            - kind: Row
              id: engine_model_detail_header_row
              spacing: 12
              align: fill
              children:
                - kind: Column
                  id: engine_model_detail_identity_col
                  spacing: 6
                  children:
                    - kind: Title
                      id: engine_model_detail_title
                      text: "@state/page/engine_model_test/title"
                      level: 3
                    - kind: Text
                      id: engine_model_detail_engine_text
                      text: "@state/page/engine_model_test/engine_name"
                      style: "font-size: 13px; opacity: 0.78;"
                - kind: Row
                  id: engine_model_detail_badges
                  spacing: 8
                  align: right
                  children:
                    - kind: Button
                      id: engine_model_detail_runtime_params_btn
                      label: "@t/system.engine.model.test.runtime_params_button"
                      icon: "ric.settings-3-line"
                      variant: secondary
                      mode: ghost
                      action: open_drawer
                      params:
                        path: "@state/page/engine_model_test/runtime_params_drawer_path"
                        title: "@t/system.engine.model.test.runtime_params_title"
                        position: right
                        dim: 720
                    - kind: Button
                      id: engine_model_detail_default_params_btn
                      label: "@t/system.engine.model.test.model_defaults_button"
                      icon: "ric.equalizer-line"
                      variant: secondary
                      mode: ghost
                      action: open_drawer
                      params:
                        path: "@state/page/engine_model_test/default_params_drawer_path"
                        title: "@t/system.engine.model.test.model_defaults_title"
                        position: right
                        dim: 960
                    - kind: Badge
                      id: engine_model_detail_format_badge
                      text: "@state/page/engine_model_test/format"
                      variant: info
                    - kind: Badge
                      id: engine_model_detail_source_badge
                      text: "@state/page/engine_model_test/source"
                      variant: default
            - kind: Flow
              id: engine_model_detail_capability_flow
              spacing: 8
              children:
                - kind: Badge
                  id: engine_model_detail_capabilities_badge
                  text: "@state/page/engine_model_test/capabilities_text"
                  variant: success
                - kind: Badge
                  id: engine_model_detail_methods_badge
                  text: "@state/page/engine_model_test/runtime_methods_text"
                  variant: secondary
            - kind: List
              id: engine_model_detail_key_details
              template: title_text
              data_source:
                type: binding
                data: {type: store, scope: page, path: /engine_model_test/detail_items, default: []}
    - kind: Alert
      id: engine_model_test_reset_notice
      title: "@t/system.engine.model.test.methods_title"
      description: "@t/system.engine.model.test.input_not_configured"
      variant: info
      show_if:
        conditions:
          - left: {type: store, scope: page, path: /engine_model_test/valid, default: false}
            op: "=="
            right: true
          - left: {type: store, scope: page, path: /engine_model_test/tests_available, default: false}
            op: "=="
            right: false
    - kind: Card
      id: engine_model_test_methods_card
      variant: elevated
      padding: [18, 18, 18, 18]
      show_if:
        conditions:
          - left: {type: store, scope: page, path: /engine_model_test/tests_available, default: false}
            op: "=="
            right: true
      children:
        - kind: Column
          id: engine_model_test_methods_body
          spacing: 12
          children:
            - kind: Title
              id: engine_model_test_methods_title
              text: "@t/system.engine.model.test.methods_title"
              level: 4
            - kind: Tabs
              id: engine_model_test_method_tabs
              tabs: "@state/page/engine_model_test/tests"
              children:
                - kind: Column
                  id: engine_model_test_method_tab_generate_completion
                  show_if:
                    conditions:
                      - left: {type: store, scope: page, path: /engine_model_test/available_tests/generate_completion, default: false}
                        op: "=="
                        right: true
                  spacing: 12
                  children:
                    - kind: Composer
                      id: engine_model_test_generate_completion_composer
                      placeholder: "@state/page/engine_model_test/generate_completion_prompt"
                      value: "@state/page/engine_model_test/generate_completion_prompt"
                      current_request: "@state/page/engine_model_test/generate_completion_current_request"
                      model: "@state/page/engine_model_test/current_model_id"
                      models: "@state/page/engine_model_test/current_models"
                      model_capabilities: "@state/page/engine_model_test/model_capabilities"
                      enable_attachment: "@state/page/engine_model_test/supports_attachments"
                      attachment_accept: "@state/page/engine_model_test/attachment_accept"
                      ingest: false
                      voice: "@state/page/engine_model_test/supports_audio_input"
                      options: "@state/page/engine_model_test/generate_completion_options"
                      options_schema: "@state/page/engine_model_test/generate_completion_options_schema"
                      options_editable: "@state/page/engine_model_test/generate_completion_options_editable"
                      tools: "@state/page/engine_model_test/available_tools"
                      skills: "@state/page/engine_model_test/available_skills"
                      mcp: "@state/page/engine_model_test/available_mcp"
                      selected_tools: "@state/page/engine_model_test/selected_tools"
                      selected_skills: "@state/page/engine_model_test/selected_skills"
                      selected_mcp: "@state/page/engine_model_test/selected_mcp"
                      tools_editable: true
                      skills_editable: true
                      mcp_editable: true
                      stop_enabled: true
                      on_stop:
                        name: system.stop_engine_model_generate_completion
                      on_submit:
                        name: system.test_engine_model_generate_completion
                        context:
                          model_row_id: "@state/page/engine_model_test/model_row_id"
                - kind: Column
                  id: engine_model_test_method_tab_generate_stream
                  show_if:
                    conditions:
                      - left: {type: store, scope: page, path: /engine_model_test/available_tests/generate_stream, default: false}
                        op: "=="
                        right: true
                  spacing: 12
                  children:
                    - kind: Composer
                      id: engine_model_test_generate_stream_composer
                      placeholder: "@state/page/engine_model_test/generate_stream_prompt"
                      value: "@state/page/engine_model_test/generate_stream_prompt"
                      current_request: "@state/page/engine_model_test/generate_stream_current_request"
                      model: "@state/page/engine_model_test/current_model_id"
                      models: "@state/page/engine_model_test/current_models"
                      model_capabilities: "@state/page/engine_model_test/model_capabilities"
                      enable_attachment: "@state/page/engine_model_test/supports_attachments"
                      attachment_accept: "@state/page/engine_model_test/attachment_accept"
                      ingest: false
                      voice: "@state/page/engine_model_test/supports_audio_input"
                      options: "@state/page/engine_model_test/generate_stream_options"
                      options_schema: "@state/page/engine_model_test/generate_stream_options_schema"
                      options_editable: "@state/page/engine_model_test/generate_stream_options_editable"
                      tools: "@state/page/engine_model_test/available_tools"
                      skills: "@state/page/engine_model_test/available_skills"
                      mcp: "@state/page/engine_model_test/available_mcp"
                      selected_tools: "@state/page/engine_model_test/selected_tools"
                      selected_skills: "@state/page/engine_model_test/selected_skills"
                      selected_mcp: "@state/page/engine_model_test/selected_mcp"
                      tools_editable: true
                      skills_editable: true
                      mcp_editable: true
                      on_submit:
                        name: system.test_engine_model_generate_stream
                        context:
                          model_row_id: "@state/page/engine_model_test/model_row_id"
                - kind: Column
                  id: engine_model_test_method_tab_embed_texts
                  show_if:
                    conditions:
                      - left: {type: store, scope: page, path: /engine_model_test/available_tests/embed_texts, default: false}
                        op: "=="
                        right: true
                  spacing: 12
                  children:
                    - kind: Form
                      id: engine_model_test_embed_texts_form
                      submit_label: "run"
                      action:
                        name: system.test_engine_model_embed_texts
                        context:
                          model_row_id: "@state/page/engine_model_test/model_row_id"
                      track_loading: system.test_engine_model_embed_texts
                      model: "@state/page/engine_model_test/forms/embed_texts"
                - kind: Column
                  id: engine_model_test_method_tab_rerank
                  show_if:
