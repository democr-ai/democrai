- kind: Column
  id: system_model_catalog_resource_warning_modal
  spacing: 14
  style: "min-width: 460px;"
  children:
    - kind: Title
      id: system_model_catalog_resource_warning_title
      text: "@data/system/model/catalog/resource_warning/title"
      level: 4
    - kind: Text
      id: system_model_catalog_resource_warning_text
      text: "@data/system/model/catalog/resource_warning/text"
    - kind: Row
      id: system_model_catalog_resource_warning_footer
      align: fill
      spacing: 8
      children:
        - kind: Button
          id: system_model_catalog_resource_warning_confirm
          label: "@t/system.model.catalog.resource_warning.confirm"
          variant: primary
          action:
            name: system.download_model
            context: {}
        - kind: Button
          id: system_model_catalog_resource_warning_cancel
          label: "@t/system.common.cancel"
          action: close_modal
