- kind: Column
  id: auth_profile_password_page
  spacing: 14
  padding: [16, 16, 16, 16]
  children:
    - kind: Title
      id: auth_profile_password_title
      text: "@t/auth.profile.password.title"
      level: 3
    - kind: Form
      id: auth_profile_password_form
      submit_label: "@t/auth.profile.password.submit"
      action: auth.change_own_password
      model:
        - name: new_password
          label: "@t/auth.profile.form.new_password"
          type: password
          validations:
            - {rule: required, message: "@t/auth.profile.form.new_password.required"}
            - {rule: min_length, value: 8, message: "@t/auth.profile.form.new_password.min_length"}
        - name: confirm_password
          label: "@t/auth.profile.form.confirm_password"
          type: password
          validations:
            - {rule: required, message: "@t/auth.profile.form.confirm_password.required"}
            - {rule: equals_field, field: new_password, message: "@t/auth.profile.form.confirm_password.equals"}
