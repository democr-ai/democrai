- kind: Column
  id: auth_profile_edit_page
  spacing: 14
  padding: [16, 16, 16, 16]
  children:
    - kind: Title
      id: auth_profile_edit_title
      text: "@t/auth.profile.edit.title"
      level: 3
    - kind: Form
      id: auth_profile_edit_form
      values: "@data/auth_profile/edit_values"
      submit_label: "@t/auth.profile.edit.submit"
      action: auth.update_profile
      model:
        - name: username
          label: "@t/auth.profile.form.username"
          type: text
          validations:
            - {rule: required, message: "@t/auth.profile.form.username.required"}
            - {rule: regex, pattern: "^[a-zA-Z0-9_.-]+$", message: "@t/auth.profile.form.username.regex"}
        - name: email
          label: "@t/auth.profile.form.email"
          type: email
          validations:
            - {rule: regex, pattern: "^[^@]+@[^@]+\\.[^@]+$", message: "@t/auth.profile.form.email.regex"}
