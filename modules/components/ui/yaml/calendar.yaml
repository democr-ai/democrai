          variant: default
          action:
            name: components.calendar_update
            context:
              mode: global_store
      - kind: Column
        id: components_complex_calendar_data_line
        spacing: 10
        style: 'margin-top: 6px; margin-bottom: 10px;'
        children:
        - kind: Calendar
          id: components_complex_calendar_data
          label: Data model calendar
          value: '@data/components_complex/calendar_model/value'
          view: '@data/components_complex/calendar_model/view'
          current_date: '@data/components_complex/calendar_model/current_date'
          events: '@data/components_complex/calendar_model/events'
          selected_dates: '@data/components_complex/calendar_model/selected_dates'
          selected_slots: '@data/components_complex/calendar_model/selected_slots'
          buttons:
          - label: Add event
            variant: primary
            action:
              name: components.calendar_selection_action
              context:
                source: data_model_add
          time_from: 8
          time_to: 18
          action:
            name: components.calendar_interaction
            context:
              source: data_model
          on_event_click:
            name: components.calendar_event_click
            context:
              source: data_model_event
        - kind: Button
          id: components_complex_calendar_data_button
          label: '@t/components.complex.usage.data_button'
          variant: default
          action:
            name: components.calendar_update
            context:
              mode: data
      - kind: Column
        id: components_complex_calendar_direct_line
        spacing: 10
        style: 'margin-top: 6px; margin-bottom: 10px;'
        children:
        - kind: Calendar
          id: components_complex_calendar_direct
          label: Direct calendar
          value: '2026-03-01'
          view: month
          current_date: '2026-03-01'
          selected_dates:
          - '2026-03-18'
          selected_slots: []
          time_from: 8
          time_to: 18
          capabilities:
          - label.set
          - value.set
          - current_date.set
          - view.set
          - events.set
          - events.append
          - selected_dates.set
          - selected_slots.set
          - buttons.set
          - time_from.set
          - time_to.set
          action:
            name: components.calendar_interaction
            context:
              source: direct
          on_event_click:
            name: components.calendar_event_click
            context:
              source: direct_event
          buttons:
          - label: Add event
            variant: primary
            action:
              name: components.calendar_selection_action
              context:
                source: direct_add
          events:
          - _id: cal_evt_standup
            date: '2026-03-05'
            time: 09:00
            title: Team standup
            duration: 30
            color: '#2563eb'
          - _id: cal_evt_board
            date: '2026-03-18'
            time: '11:00'
            title: Board review
            duration: 120
            color: '#7c3aed'
        - kind: Row
          id: components_complex_calendar_direct_buttons
          spacing: 8
          children:
          - kind: Button
            id: components_complex_calendar_direct_update
            label: '@t/components.complex.usage.direct_button'
            variant: default
            action:
              name: components.calendar_update
              context:
                mode: direct
          - kind: Button
            id: components_complex_calendar_direct_append
            label: '@t/components.complex.calendar.append_button'
            variant: default
            action: components.calendar_append_direct
