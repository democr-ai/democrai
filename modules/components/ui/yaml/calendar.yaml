      - kind: Column
        id: components_complex_calendar_page_line
        spacing: 10
        style: 'margin-top: 6px; margin-bottom: 10px;'
        children:
        - kind: Calendar
          id: components_complex_calendar_page
          label: Page store calendar
          value:
            type: store
            scope: page
            path: /components_complex/calendar/page/value
          view:
            type: store
            scope: page
            path: /components_complex/calendar/page/view
          current_date:
            type: store
            scope: page
            path: /components_complex/calendar/page/current_date
          events:
            type: store
            scope: page
            path: /components_complex/calendar/page/events
          selected_dates:
            type: store
            scope: page
            path: /components_complex/calendar/page/selected_dates
          selected_slots:
