            scope: global
            path: /components_complex/calendar/global/value
          view:
            type: store
            scope: global
            path: /components_complex/calendar/global/view
          current_date:
            type: store
            scope: global
            path: /components_complex/calendar/global/current_date
          events:
            type: store
            scope: global
            path: /components_complex/calendar/global/events
          selected_dates:
            type: store
            scope: global
            path: /components_complex/calendar/global/selected_dates
          selected_slots:
