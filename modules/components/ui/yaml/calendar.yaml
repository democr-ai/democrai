- kind: Column
  id: components_complex_calendar_root
  spacing: 22
  children:
  - kind: Column
    id: components_complex_calendar_header
    spacing: 8
    children:
    - kind: Title
      id: components_complex_calendar_eyebrow
      text: '@t/components.complex.eyebrow'
      level: 4
    - kind: Title
      id: components_complex_calendar_title
      text: '@t/components.complex.calendar.title'
      level: 1
    - kind: Text
      id: components_complex_calendar_description
      text: '@t/components.complex.calendar.description'
      muted: true
  - kind: Card
    id: components_complex_calendar_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 16
    children:
    - kind: Title
      id: components_complex_calendar_preview_title
      text: '@t/components.complex.preview.title'
      level: 3
    - kind: Calendar
      id: components_complex_calendar_preview
      label: Planning calendar
      value: '2026-03-01'
      min_date: '2026-03-01'
      max_date: '2026-04-30'
      date_format: yyyy-MM-dd
      input_mask: '0000-00-00'
      show_input: true
      view: month
      current_date: '2026-03-01'
      selected_dates:
      - '2026-03-18'
      selected_slots: []
      time_from: 8
      time_to: 18
      action:
        name: components.calendar_interaction
        context:
          source: preview
      on_event_click:
        name: components.calendar_event_click
        context:
          source: preview_event
      buttons:
      - label: Add event
        variant: primary
        action:
          name: components.calendar_selection_action
          context:
            source: preview_add
      - label: Inspect selection
        variant: default
        action:
          name: components.calendar_selection_action
          context:
            source: preview_inspect
      events:
      - _id: cal_evt_standup
        date: '2026-03-05'
        time: 09:00
        title: Team standup
        duration: 30
        description: Daily runtime sync.
        color: '#2563eb'
      - _id: cal_evt_demo
        date: '2026-03-10'
        time: '14:00'
        title: Product demo
        duration: 60
        description: Component walkthrough.
        color: '#16a34a'
      - _id: cal_evt_board
        date: '2026-03-18'
        time: '11:00'
        title: Board review
        duration: 120
        description: Quarterly planning session.
        color: '#7c3aed'
      - _id: cal_evt_release
        date: '2026-03-26'
        time: '15:30'
        title: Release v2.4
        duration: 45
        description: Production release window.
        color: '#dc2626'
