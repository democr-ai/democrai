- kind: Column
  id: components_forms_radio_root
  spacing: 22
  children:
  - kind: Column
    id: components_forms_radio_header
    spacing: 8
    children:
    - kind: Title
      id: components_forms_radio_eyebrow
      text: '@t/components.forms.eyebrow'
      level: 4
    - kind: Title
      id: components_forms_radio_title
      text: '@t/components.forms.radio.title'
      level: 1
    - kind: Text
      id: components_forms_radio_description
      text: '@t/components.forms.radio.description'
      muted: true
  - kind: Card
    id: components_forms_radio_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_radio_preview_title
      text: '@t/components.forms.preview.title'
      level: 3
    - kind: RadioGroup
      id: components_forms_radio_preview
      label: '@t/components.forms.radio.preview.label'
      value: medium
      options: '@data/components_forms/radio_options'
    - kind: Button
      id: components_forms_radio_read_button
      label: '@t/components.forms.usage.read_button'
      variant: default
      action: components.form_preview_show_value
      params:
        input_id: components_forms_radio_preview
        label: radio
      collect_input_ids:
      - components_forms_radio_preview
  - kind: Card
    id: components_forms_radio_runtime_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 18
    children:
    - kind: Title
      id: components_forms_radio_runtime_title
      text: '@t/components.forms.runtime.title'
      level: 3
    - kind: Text
      id: components_forms_radio_runtime_description
      text: '@t/components.forms.radio.runtime.description'
      muted: true
    - kind: Row
      id: components_forms_radio_runtime_grid
      spacing: 18
      align: fill
      children:
      - kind: Column
        id: components_forms_radio_runtime_left
        spacing: 16
        children:
        - kind: Column
          id: components_forms_radio_page_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: RadioGroup
            id: components_forms_radio_page
            label: '@t/components.forms.usage.page_store'
            value:
              type: store
              scope: page
              path: /components_forms/radio/value
            options: '@data/components_forms/radio_options'
          - kind: Button
            id: components_forms_radio_page_button
            label: '@t/components.forms.usage.page_store_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: radio
                mode: page_store
        - kind: Column
          id: components_forms_radio_data_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: RadioGroup
            id: components_forms_radio_data
            label: '@t/components.forms.usage.data_model'
            value: '@data/components_forms/radio_model/value'
            options: '@data/components_forms/radio_options'
          - kind: Button
            id: components_forms_radio_data_button
            label: '@t/components.forms.usage.data_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: radio
                mode: data
      - kind: Column
        id: components_forms_radio_runtime_right
        spacing: 16
        children:
        - kind: Column
          id: components_forms_radio_global_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: RadioGroup
            id: components_forms_radio_global
            label: '@t/components.forms.usage.global_store'
            value:
              type: store
              scope: global
              path: /components_forms/radio/value
            options: '@data/components_forms/radio_options'
          - kind: Button
            id: components_forms_radio_global_button
            label: '@t/components.forms.usage.global_store_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: radio
                mode: global_store
        - kind: Column
          id: components_forms_radio_direct_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: RadioGroup
            id: components_forms_radio_direct
            label: '@t/components.forms.usage.direct'
            value: draft
            options: '@data/components_forms/radio_options'
            capabilities:
            - value.set
          - kind: Button
            id: components_forms_radio_direct_button
            label: '@t/components.forms.usage.direct_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: radio
                mode: direct
  - kind: Card
    id: components_forms_radio_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_radio_definition_title
      text: '@t/components.forms.definition.title'
      level: 3
    - kind: Row
      id: components_forms_radio_definition_grid
      spacing: 16
      align: fill
      children:
      - kind: Markdown
        id: components_forms_radio_python_code
        text: '@t/components.forms.radio.definition.python'
      - kind: Markdown
        id: components_forms_radio_yaml_code
        text: '@t/components.forms.radio.definition.yaml'
  - kind: Card
    id: components_forms_radio_binding_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_radio_binding_title
      text: '@t/components.forms.binding.title'
      level: 3
    - kind: DataTable
      id: components_forms_radio_binding_table
      paginated: false
      pagination: false
      rows: '@data/components_forms/radio_bindings'
      model:
      - field: binding
        header: '@t/components.forms.table.binding'
        type: str
      - field: yaml
        header: '@t/components.forms.table.yaml'
        type: str
      - field: source
        header: '@t/components.forms.table.source'
        type: str
  - kind: Card
    id: components_forms_radio_properties_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_radio_properties_title
      text: '@t/components.forms.properties.title'
      level: 3
    - kind: DataTable
      id: components_forms_radio_properties_table
      paginated: false
      pagination: false
      rows: '@data/components_forms/radio_properties'
      model:
      - field: property
        header: '@t/components.forms.table.property'
        type: str
      - field: type
        header: '@t/components.forms.table.type'
        type: str
      - field: usage
        header: '@t/components.forms.table.usage'
        type: str
