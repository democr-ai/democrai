- kind: Column
  id: components_forms_checkbox_root
  spacing: 22
  children:
  - kind: Column
    id: components_forms_checkbox_header
    spacing: 8
    children:
    - kind: Title
      id: components_forms_checkbox_eyebrow
      text: '@t/components.forms.eyebrow'
      level: 4
    - kind: Title
      id: components_forms_checkbox_title
      text: '@t/components.forms.checkbox.title'
      level: 1
    - kind: Text
      id: components_forms_checkbox_description
      text: '@t/components.forms.checkbox.description'
      muted: true
  - kind: Card
    id: components_forms_checkbox_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_checkbox_preview_title
      text: '@t/components.forms.preview.title'
      level: 3
    - kind: Checkbox
      id: components_forms_checkbox_basic
      label: '@t/components.forms.checkbox.preview.label'
      checked: false
    - kind: Button
      id: components_forms_checkbox_read_button
      label: '@t/components.forms.usage.read_button'
      variant: default
      action: components.form_preview_show_value
      params:
        input_id: components_forms_checkbox_basic
        label: checkbox
      collect_input_ids:
      - components_forms_checkbox_basic
  - kind: Card
    id: components_forms_checkbox_runtime_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 18
    children:
    - kind: Title
      id: components_forms_checkbox_runtime_title
      text: '@t/components.forms.runtime.title'
      level: 3
    - kind: Text
      id: components_forms_checkbox_runtime_description
      text: '@t/components.forms.checkbox.runtime.description'
      muted: true
    - kind: Row
      id: components_forms_checkbox_runtime_grid
      spacing: 18
      align: fill
      children:
      - kind: Column
        id: components_forms_checkbox_runtime_left
        spacing: 16
        children:
        - kind: Column
          id: components_forms_checkbox_page_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Checkbox
            id: components_forms_checkbox_page
            label: '@t/components.forms.usage.page_store'
            checked:
              type: store
              scope: page
              path: /components_forms/checkbox/checked
              default: false
          - kind: Button
            id: components_forms_checkbox_page_button
            label: '@t/components.forms.usage.page_store_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: checkbox
                mode: page_store
        - kind: Column
          id: components_forms_checkbox_data_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Checkbox
            id: components_forms_checkbox_data
            label: '@t/components.forms.usage.data_model'
            checked: '@data/components_forms/checkbox_model/checked'
          - kind: Button
            id: components_forms_checkbox_data_button
            label: '@t/components.forms.usage.data_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: checkbox
                mode: data
      - kind: Column
        id: components_forms_checkbox_runtime_right
        spacing: 16
        children:
        - kind: Column
          id: components_forms_checkbox_global_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Checkbox
            id: components_forms_checkbox_global
            label: '@t/components.forms.usage.global_store'
            checked:
              type: store
              scope: global
              path: /components_forms/checkbox/checked
              default: false
          - kind: Button
            id: components_forms_checkbox_global_button
            label: '@t/components.forms.usage.global_store_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: checkbox
                mode: global_store
        - kind: Column
          id: components_forms_checkbox_direct_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Checkbox
            id: components_forms_checkbox_direct
            label: '@t/components.forms.usage.direct'
            checked: false
            capabilities:
            - checked.set
          - kind: Button
            id: components_forms_checkbox_direct_button
            label: '@t/components.forms.usage.direct_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: checkbox
                mode: direct
  - kind: Card
    id: components_forms_checkbox_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_checkbox_definition_title
      text: '@t/components.forms.definition.title'
      level: 3
    - kind: Row
      id: components_forms_checkbox_definition_grid
      spacing: 16
      align: fill
      children:
      - kind: Markdown
        id: components_forms_checkbox_python_code
        text: '@t/components.forms.checkbox.definition.python'
      - kind: Markdown
        id: components_forms_checkbox_yaml_code
        text: '@t/components.forms.checkbox.definition.yaml'
  - kind: Card
    id: components_forms_checkbox_binding_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_checkbox_binding_title
      text: '@t/components.forms.binding.title'
      level: 3
    - kind: DataTable
      id: components_forms_checkbox_binding_table
      paginated: false
      pagination: false
      rows: '@data/components_forms/checkbox_bindings'
      model:
      - field: binding
        header: '@t/components.forms.table.binding'
        type: str
      - field: yaml
        header: '@t/components.forms.table.yaml'
        type: str
      - field: source
        header: '@t/components.forms.table.source'
        type: str
  - kind: Card
    id: components_forms_checkbox_properties_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_checkbox_properties_title
      text: '@t/components.forms.properties.title'
      level: 3
    - kind: DataTable
      id: components_forms_checkbox_properties_table
      paginated: false
      pagination: false
      rows: '@data/components_forms/checkbox_properties'
      model:
      - field: property
        header: '@t/components.forms.table.property'
        type: str
      - field: type
        header: '@t/components.forms.table.type'
        type: str
      - field: usage
        header: '@t/components.forms.table.usage'
        type: str
