- kind: Column
  id: components_forms_toggle_root
  spacing: 22
  children:
  - kind: Column
    id: components_forms_toggle_header
    spacing: 8
    children:
    - kind: Title
      id: components_forms_toggle_eyebrow
      text: '@t/components.forms.eyebrow'
      level: 4
    - kind: Title
      id: components_forms_toggle_title
      text: '@t/components.forms.toggle.title'
      level: 1
    - kind: Text
      id: components_forms_toggle_description
      text: '@t/components.forms.toggle.description'
      muted: true
  - kind: Card
    id: components_forms_toggle_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_toggle_preview_title
      text: '@t/components.forms.preview.title'
      level: 3
    - kind: Toggle
      id: components_forms_toggle_basic
      label: '@t/components.forms.toggle.preview.label'
      checked: false
    - kind: Button
      id: components_forms_toggle_read_button
      label: '@t/components.forms.usage.read_button'
      variant: default
      action: components.form_preview_show_value
      params:
        input_id: components_forms_toggle_basic
        label: toggle
      collect_input_ids:
      - components_forms_toggle_basic
  - kind: Card
    id: components_forms_toggle_runtime_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 18
    children:
    - kind: Title
      id: components_forms_toggle_runtime_title
      text: '@t/components.forms.runtime.title'
      level: 3
    - kind: Text
      id: components_forms_toggle_runtime_description
      text: '@t/components.forms.toggle.runtime.description'
      muted: true
    - kind: Row
      id: components_forms_toggle_runtime_grid
      spacing: 18
      align: fill
      children:
      - kind: Column
        id: components_forms_toggle_runtime_left
        spacing: 16
        children:
        - kind: Column
          id: components_forms_toggle_page_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Toggle
            id: components_forms_toggle_page
            label: '@t/components.forms.usage.page_store'
            checked:
              type: store
              scope: page
              path: /components_forms/toggle/checked
              default: false
          - kind: Button
            id: components_forms_toggle_page_button
            label: '@t/components.forms.usage.page_store_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: toggle
                mode: page_store
        - kind: Column
          id: components_forms_toggle_data_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Toggle
            id: components_forms_toggle_data
            label: '@t/components.forms.usage.data_model'
            checked: '@data/components_forms/toggle_model/checked'
          - kind: Button
            id: components_forms_toggle_data_button
            label: '@t/components.forms.usage.data_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: toggle
                mode: data
      - kind: Column
        id: components_forms_toggle_runtime_right
        spacing: 16
        children:
        - kind: Column
          id: components_forms_toggle_global_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Toggle
            id: components_forms_toggle_global
            label: '@t/components.forms.usage.global_store'
            checked:
              type: store
              scope: global
              path: /components_forms/toggle/checked
              default: false
          - kind: Button
            id: components_forms_toggle_global_button
            label: '@t/components.forms.usage.global_store_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: toggle
                mode: global_store
        - kind: Column
          id: components_forms_toggle_direct_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Toggle
            id: components_forms_toggle_direct
            label: '@t/components.forms.usage.direct'
            checked: false
            capabilities:
            - checked.set
          - kind: Button
            id: components_forms_toggle_direct_button
            label: '@t/components.forms.usage.direct_button'
            variant: default
            action:
              name: components.form_input_update
              context:
                component: toggle
                mode: direct
  - kind: Card
    id: components_forms_toggle_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_toggle_definition_title
      text: '@t/components.forms.definition.title'
      level: 3
    - kind: Row
      id: components_forms_toggle_definition_grid
      spacing: 16
      align: fill
      children:
      - kind: Markdown
        id: components_forms_toggle_python_code
        text: '@t/components.forms.toggle.definition.python'
      - kind: Markdown
        id: components_forms_toggle_yaml_code
        text: '@t/components.forms.toggle.definition.yaml'
  - kind: Card
    id: components_forms_toggle_binding_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_toggle_binding_title
      text: '@t/components.forms.binding.title'
      level: 3
    - kind: DataTable
      id: components_forms_toggle_binding_table
      paginated: false
      pagination: false
      rows: '@data/components_forms/toggle_bindings'
      model:
      - field: binding
        header: '@t/components.forms.table.binding'
        type: str
      - field: yaml
        header: '@t/components.forms.table.yaml'
        type: str
      - field: source
        header: '@t/components.forms.table.source'
        type: str
  - kind: Card
    id: components_forms_toggle_properties_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_toggle_properties_title
      text: '@t/components.forms.properties.title'
      level: 3
    - kind: DataTable
      id: components_forms_toggle_properties_table
      paginated: false
      pagination: false
      rows: '@data/components_forms/toggle_properties'
      model:
      - field: property
        header: '@t/components.forms.table.property'
        type: str
      - field: type
        header: '@t/components.forms.table.type'
        type: str
      - field: usage
        header: '@t/components.forms.table.usage'
        type: str
