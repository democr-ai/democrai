- kind: Column
  id: components_media_video_root
  spacing: 22
  children:
  - kind: Column
    id: components_media_video_header
    spacing: 8
    children:
    - kind: Title
      id: components_media_video_eyebrow
      text: '@t/components.media.eyebrow'
      level: 4
    - kind: Title
      id: components_media_video_title
      text: '@t/components.media.video.title'
      level: 1
    - kind: Text
      id: components_media_video_description
      text: '@t/components.media.video.description'
      muted: true
  - kind: Card
    id: components_media_video_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_media_video_preview_title
      text: '@t/components.media.preview.title'
      level: 3
    - kind: Video
      id: components_media_video_static
      source: assets/test.mp4
      title: '@t/components.media.video.preview.title'
      poster: assets/demo-image.png
      controls: true
      width: 360
      height: 210
    - kind: Text
      id: components_media_video_preview_note
      text: '@t/components.media.video.preview.note'
      muted: true
  - kind: Card
    id: components_media_video_runtime_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 18
    children:
    - kind: Title
      id: components_media_video_runtime_title
      text: '@t/components.media.runtime.title'
      level: 3
    - kind: Text
      id: components_media_video_runtime_description
      text: '@t/components.media.video.runtime.description'
      muted: true
    - kind: Row
      id: components_media_video_runtime_grid
      spacing: 18
      align: fill
      children:
      - kind: Column
        id: components_media_video_runtime_left
        spacing: 18
        children:
        - kind: Column
          id: components_media_video_page_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Video
            id: components_media_video_page
            source:
              type: store
              scope: page
              path: /components_media/video/source
              default: assets/test.mp4
            title:
              type: store
              scope: page
              path: /components_media/video/title
              default: Flower MP4
            poster:
              type: store
              scope: page
              path: /components_media/video/poster
              default: assets/demo-image.png
            controls: true
            width: 360
            height: 210
          - kind: Button
            id: components_media_video_page_button
            label: '@t/components.media.usage.page_store_button'
            variant: default
            action:
              name: components.video_update
              context:
                mode: page_store
        - kind: Column
          id: components_media_video_data_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Video
            id: components_media_video_data
            source: '@data/components_media/video_model/source'
            title: '@data/components_media/video_model/title'
            poster: '@data/components_media/video_model/poster'
            controls: true
            width: 360
            height: 210
          - kind: Button
            id: components_media_video_data_button
            label: '@t/components.media.usage.data_button'
            variant: default
            action:
              name: components.video_update
              context:
                mode: data
      - kind: Column
        id: components_media_video_runtime_right
        spacing: 18
        children:
        - kind: Column
          id: components_media_video_global_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Video
            id: components_media_video_global
            source:
              type: store
              scope: global
              path: /components_media/video/source
              default: assets/test.mp4
            title:
              type: store
              scope: global
              path: /components_media/video/title
              default: Global Flower MP4
            poster:
              type: store
              scope: global
              path: /components_media/video/poster
              default: assets/demo-image.png
            controls: true
            width: 360
            height: 210
          - kind: Button
            id: components_media_video_global_button
            label: '@t/components.media.usage.global_store_button'
            variant: default
            action:
              name: components.video_update
              context:
                mode: global_store
        - kind: Column
          id: components_media_video_direct_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Video
            id: components_media_video_direct
            source: assets/test.mp4
            title: '@t/components.media.video.direct.title'
            poster: assets/demo-image.png
            controls: true
            width: 360
            height: 210
            capabilities:
            - source.set
            - title.set
            - poster.set
          - kind: Button
            id: components_media_video_direct_button
            label: '@t/components.media.usage.direct_button'
            variant: default
            action:
              name: components.video_update
              context:
                mode: direct
  - kind: Card
    id: components_media_video_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_media_video_definition_title
      text: '@t/components.media.definition.title'
      level: 3
    - kind: Row
      id: components_media_video_definition_grid
      spacing: 16
      align: fill
      children:
      - kind: Markdown
        id: components_media_video_python_code
        text: '@t/components.media.video.definition.python'
      - kind: Markdown
        id: components_media_video_yaml_code
        text: '@t/components.media.video.definition.yaml'
  - kind: Card
    id: components_media_video_binding_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_media_video_binding_title
      text: '@t/components.media.binding.title'
      level: 3
    - kind: DataTable
      id: components_media_video_binding_table
      paginated: false
      pagination: false
      total_rows: 4
      rows: '@data/components_media/video_bindings'
      model:
      - field: binding
        header: '@t/components.media.table.binding'
        type: str
      - field: yaml
        header: '@t/components.media.table.yaml'
        type: str
      - field: source
        header: '@t/components.media.table.source'
        type: str
  - kind: Card
    id: components_media_video_properties_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_media_video_properties_title
      text: '@t/components.media.properties.title'
      level: 3
    - kind: DataTable
      id: components_media_video_properties_table
      paginated: false
      pagination: false
      total_rows: 5
      rows: '@data/components_media/video_properties'
      model:
      - field: property
        header: '@t/components.media.table.property'
        type: str
      - field: type
        header: '@t/components.media.table.type'
        type: str
      - field: usage
        header: '@t/components.media.table.usage'
        type: str
