- kind: Column
  id: components_progress_root
  spacing: 22
  children:
  - kind: Column
    id: components_progress_header
    spacing: 8
    children:
    - kind: Title
      id: components_progress_eyebrow
      text: '@t/components.content.eyebrow'
      level: 4
    - kind: Title
      id: components_progress_title
      text: '@t/components.content.progress.title'
      level: 1
    - kind: Text
      id: components_progress_description
      text: '@t/components.content.progress.description'
      muted: true
  - kind: Card
    id: components_progress_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_progress_preview_title
      text: '@t/components.content.preview.title'
      level: 3
    - kind: Column
      id: components_progress_preview_stack
      spacing: 14
      children:
      - kind: Progress
        id: components_progress_static_zero
        value: 0
        maximum: 100
        label: '@t/components.content.progress.preview.zero'
      - kind: Progress
        id: components_progress_static_half
        value: 50
        maximum: 100
        label: '@t/components.content.progress.preview.half'
      - kind: Progress
        id: components_progress_static_done
        value: 100
        maximum: 100
        label: '@t/components.content.progress.preview.done'
  - kind: Card
    id: components_progress_runtime_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 18
    children:
    - kind: Title
      id: components_progress_runtime_title
      text: '@t/components.content.runtime.title'
      level: 3
    - kind: Text
      id: components_progress_runtime_description
      text: '@t/components.content.progress.runtime.description'
      muted: true
    - kind: Column
      id: components_progress_runtime_stack
      spacing: 18
      children:
      - kind: Column
        id: components_progress_page_line
        spacing: 10
        style: 'margin-top: 6px; margin-bottom: 10px;'
        children:
        - kind: Progress
          id: components_progress_page
          value:
            type: store
            scope: page
            path: /components_content/progress/value
            default: 25
          maximum:
            type: store
            scope: page
            path: /components_content/progress/maximum
            default: 100
          label:
            type: store
            scope: page
            path: /components_content/progress/label
            default: Queued
          show_label:
            type: store
            scope: page
            path: /components_content/progress/show_label
            default: true
        - kind: Button
          id: components_progress_page_button
          label: '@t/components.content.usage.page_store_button'
          variant: default
          action:
            name: components.progress_update
            context:
              mode: page_store
      - kind: Column
        id: components_progress_global_line
        spacing: 10
        style: 'margin-top: 6px; margin-bottom: 10px;'
        children:
        - kind: Progress
          id: components_progress_global
          value:
            type: store
            scope: global
            path: /components_content/progress/value
            default: 35
          maximum:
            type: store
            scope: global
            path: /components_content/progress/maximum
            default: 100
          label:
            type: store
            scope: global
            path: /components_content/progress/label
            default: Global queued
          show_label:
            type: store
            scope: global
            path: /components_content/progress/show_label
            default: true
        - kind: Button
          id: components_progress_global_button
          label: '@t/components.content.usage.global_store_button'
          variant: default
          action:
            name: components.progress_update
            context:
              mode: global_store
      - kind: Column
        id: components_progress_data_line
        spacing: 10
        style: 'margin-top: 6px; margin-bottom: 10px;'
        children:
        - kind: Progress
          id: components_progress_data
          value: '@data/components_content/progress_model/value'
          maximum: '@data/components_content/progress_model/maximum'
          label: '@data/components_content/progress_model/label'
          show_label: '@data/components_content/progress_model/show_label'
        - kind: Button
          id: components_progress_data_button
          label: '@t/components.content.usage.data_button'
          variant: default
          action:
            name: components.progress_update
            context:
              mode: data
      - kind: Column
        id: components_progress_direct_line
        spacing: 10
        style: 'margin-top: 6px; margin-bottom: 10px;'
        children:
        - kind: Progress
          id: components_progress_direct
          value: 10
          maximum: 120
          label: '@t/components.content.progress.direct.label'
          capabilities:
          - value.set
          - maximum.set
          - label.set
        - kind: Button
          id: components_progress_direct_button
          label: '@t/components.content.usage.direct_button'
          variant: default
          action:
            name: components.progress_update
            context:
              mode: direct
  - kind: Card
    id: components_progress_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_progress_definition_title
      text: '@t/components.content.definition.title'
      level: 3
    - kind: Row
      id: components_progress_definition_grid
      spacing: 16
      align: fill
      children:
      - kind: Markdown
        id: components_progress_python_code
        text: '@t/components.content.progress.definition.python'
      - kind: Markdown
        id: components_progress_yaml_code
        text: '@t/components.content.progress.definition.yaml'
  - kind: Card
    id: components_progress_binding_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_progress_binding_title
      text: '@t/components.content.binding.title'
      level: 3
    - kind: DataTable
      id: components_progress_binding_table
      paginated: false
      pagination: false
      total_rows: 4
      rows: '@data/components_content/progress_bindings'
      model:
      - field: binding
        header: '@t/components.content.table.binding'
        type: str
      - field: yaml
        header: '@t/components.content.table.yaml'
        type: str
      - field: source
        header: '@t/components.content.table.source'
        type: str
  - kind: Card
    id: components_progress_properties_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_progress_properties_title
      text: '@t/components.content.properties.title'
      level: 3
    - kind: DataTable
      id: components_progress_properties_table
      paginated: false
      pagination: false
      total_rows: 5
      rows: '@data/components_content/progress_properties'
      model:
      - field: property
        header: '@t/components.content.table.property'
        type: str
      - field: type
        header: '@t/components.content.table.type'
        type: str
      - field: usage
        header: '@t/components.content.table.usage'
        type: str
