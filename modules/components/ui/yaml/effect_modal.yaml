- kind: Column
  id: components_effect_modal_root
  spacing: 22
  children:
  - kind: Column
    id: components_effect_modal_header
    spacing: 8
    children:
    - kind: Title
      id: components_effect_modal_eyebrow
      text: '@t/components.effects.eyebrow'
      level: 4
    - kind: Title
      id: components_effect_modal_title
      text: '@t/components.effects.modal.title'
      level: 1
    - kind: Text
      id: components_effect_modal_description
      text: '@t/components.effects.modal.description'
      muted: true
  - kind: Card
    id: components_effect_modal_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 16
    children:
    - kind: Title
      id: components_effect_modal_preview_title
      text: '@t/components.effects.preview.title'
      level: 3
    - kind: Row
      id: components_effect_modal_buttons
      spacing: 10
      align: left
      children:
      - kind: Button
        id: components_effect_modal_520
        label: '@t/components.effects.modal.small'
        action: open_modal
        params:
          path: /components/overlays/modal_sample
          title: Effects modal 520
          width: 520
        variant: primary
        icon: ric.window-line
      - kind: Button
        id: components_effect_modal_720
        label: '@t/components.effects.modal.large'
        action: open_modal
        params:
          path: /components/overlays/modal_sample
          title: Effects modal 720
          width: 720
        variant: primary
        icon: ric.window-line
  - kind: Card
    id: components_effect_modal_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_effect_modal_definition_title
      text: '@t/components.effects.definition.title'
      level: 3
    - kind: Row
      id: components_effect_modal_definition_grid
      spacing: 16
      align: fill
      children:
      - kind: Markdown
        id: components_effect_modal_python
        text: '@t/components.effects.modal.definition.python'
      - kind: Markdown
        id: components_effect_modal_yaml
        text: '@t/components.effects.modal.definition.yaml'
  - kind: Card
    id: components_effect_modal_properties_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_effect_modal_properties_title
      text: '@t/components.effects.properties.title'
      level: 3
    - kind: DataTable
      id: components_effect_modal_properties_table
      paginated: false
      pagination: false
      rows:
      - field: path
        type: str
        usage: '@t/components.effects.modal.property.path'
      - field: title
        type: str
        usage: '@t/components.effects.modal.property.title'
      - field: width
        type: int
        usage: '@t/components.effects.modal.property.width'
      model:
      - field: field
        header: '@t/components.effects.table.field'
        type: str
      - field: type
        header: '@t/components.effects.table.type'
        type: str
      - field: usage
        header: '@t/components.effects.table.usage'
        type: str
