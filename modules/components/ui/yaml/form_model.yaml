- kind: Column
  id: components_forms_model_root
  spacing: 22
  children:
  - kind: Column
    id: components_forms_model_header
    spacing: 8
    children:
    - kind: Title
      id: components_forms_model_eyebrow
      text: '@t/components.forms.eyebrow'
      level: 4
    - kind: Title
      id: components_forms_model_title
      text: '@t/components.forms.model.title'
      level: 1
    - kind: Text
      id: components_forms_model_description
      text: '@t/components.forms.model.description'
      muted: true
  - kind: Card
    id: components_forms_model_registration_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_model_registration_title
      text: '@t/components.forms.model.registration.title'
      level: 3
    - kind: Text
      id: components_forms_model_registration_description
      text: '@t/components.forms.model.registration.description'
      muted: true
    - kind: Form
      id: model_register_form
      submit_label: '@t/components.forms.model.registration.submit'
      action: components.form_model_submit
      model:
      - type: row
        spacing: 16
        children:
        - name: first_name
          label: First Name
          type: text
          placeholder: Ada
          stretch: 1
          validations:
          - rule: required
            message: First name is required
          - rule: min_length
            value: 2
            message: At least 2 characters
        - name: last_name
          label: Last Name
          type: text
          placeholder: Lovelace
          stretch: 1
          validations:
          - rule: required
            message: Last name is required
          - rule: min_length
            value: 2
            message: At least 2 characters
      - type: row
        spacing: 16
        children:
        - name: username
          label: Username
          type: text
          placeholder: adalovelace
          stretch: 1
          validations:
          - rule: required
            message: Username is required
          - rule: regex
            pattern: ^[a-zA-Z0-9_]+$
            message: Only letters
            numbers and underscore allowed: null
          - rule: min_length
            value: 4
            message: At least 4 characters
        - name: email
          label: Email
          type: email
          placeholder: you@example.com
          stretch: 1
          validations:
          - rule: required
            message: Email is required
          - rule: regex
            pattern: ^[^@]+@[^@]+\.[^@]+$
            message: Invalid email format
      - type: row
        spacing: 16
        children:
        - name: password
          label: Password
          type: password
          placeholder: Min 8 characters
          stretch: 1
          validations:
          - rule: required
            message: Password is required
          - rule: min_length
            value: 8
            message: At least 8 characters
        - name: confirm_password
          label: Confirm Password
          type: password
          placeholder: Repeat your password
          stretch: 1
          validations:
          - rule: required
            message: Please confirm your password
          - rule: equals_field
            field: password
            message: Passwords do not match
      - type: row
        spacing: 16
        children:
        - name: role
          label: Role
          type: select
          stretch: 1
          options:
          - label: Super Admin
            value: super_admin
          - label: Organization Admin
            value: organization_admin
          - label: User
            value: user
          validations:
          - rule: required
            message: Please select a role
      - name: gender
        label: Gender
        type: radio
        options:
        - label: Female
          value: f
        - label: Male
          value: m
        - label: Other
          value: o
        validations:
        - rule: required
          message: Please select gender
      - name: terms
        label: I accept Terms and Privacy Policy
        type: checkbox
        validations:
        - rule: required
          message: You must accept terms
    - kind: Button
      id: model_register_show_btn
      label: '@t/components.forms.usage.read_button'
      variant: default
      action: components.form_preview_show_value
      params:
        label: registration_form
        form_id: model_register_form
        field_ids:
        - first_name
        - last_name
        - username
        - email
        - password
        - confirm_password
        - role
        - gender
        - terms
      collect_input_ids:
      - model_register_form_first_name
      - model_register_form_last_name
      - model_register_form_username
      - model_register_form_email
      - model_register_form_password
      - model_register_form_confirm_password
      - model_register_form_role
      - model_register_form_gender
      - model_register_form_terms
  - kind: Card
    id: components_forms_model_support_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_forms_model_support_title
      text: '@t/components.forms.model.support.title'
      level: 3
    - kind: Text
      id: components_forms_model_support_description
      text: '@t/components.forms.model.support.description'
      muted: true
    - kind: Form
      id: model_support_form
      submit_label: '@t/components.forms.model.support.submit'
      action: components.form_model_submit
      model:
      - name: subject
        label: Subject
        type: text
        placeholder: Short summary
        validations:
        - rule: required
          message: Subject is required
        - rule: min_length
          value: 5
          message: At least 5 characters
      - name: priority
        label: Priority
        type: select
        options:
        - label: Low
          value: low
        - label: Medium
          value: medium
        - label: High
          value: high
        - label: Urgent
          value: urgent
        validations:
        - rule: required
          message: Select a priority
      - name: tags
        label: Tags
        type: tags
        value:
        - bug
        - ui
        placeholder: backend
        item_schema:
          type: text
        validations:
        - rule: required
          message: Select at least one tag
      - name: details
        label: Details
        type: textarea
        placeholder: Describe the issue...
        validations:
        - rule: required
          message: Details are required
        - rule: min_length
          value: 20
          message: At least 20 characters
        - rule: max_length
          value: 800
          message: Max 800 characters
      - name: watchers
        label: Watchers
        type: editable_list
        value:
        - support
        - platform
        placeholder: security
        add_label: Add watcher
        remove_label: Remove
        submit_label: Save local list
        item_schema:
          type: text
      - name: attachment
        label: Attachment
        type: file
        accept: .pdf,.png,.jpg,.jpeg,.zip,.txt
    - kind: Button
      id: model_support_show_btn
      label: '@t/components.forms.usage.read_button'
      variant: default
      action: components.form_preview_show_value
      params:
        label: support_ticket_form
        form_id: model_support_form
        field_ids:
        - subject
        - priority
        - tags
        - details
        - watchers
        - attachment
      collect_input_ids:
      - model_support_form_subject
      - model_support_form_priority
      - model_support_form_tags
      - model_support_form_details
      - model_support_form_watchers
      - model_support_form_attachment
