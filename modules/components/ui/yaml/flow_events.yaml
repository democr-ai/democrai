        text: '@t/components.flow.events.definition.slot'
      - kind: Markdown
        id: components_flow_events_listener_code
        text: '@t/components.flow.events.definition.listener'
  - kind: Card
    id: components_flow_events_emit_card
    variant: outlined
    padding:
    - 20
