      id: components_flow_events_eyebrow
      text: '@t/components.flow.state.eyebrow'
      level: 4
    - kind: Title
      id: components_flow_events_title
      text: '@t/components.flow.events.title'
      level: 1
    - kind: Text
      id: components_flow_events_description
      text: '@t/components.flow.events.description'
      muted: true
  - kind: Card
    id: components_flow_events_overview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
