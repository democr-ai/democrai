    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_flow_events_api_title
      text: '@t/components.flow.state.api.title'
      level: 3
    - kind: DataTable
