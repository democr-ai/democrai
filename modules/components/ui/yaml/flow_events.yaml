      id: components_flow_events_overview_title
      text: '@t/components.flow.state.overview.title'
      level: 3
    - kind: Markdown
      id: components_flow_events_overview_text
      text: '@t/components.flow.events.overview'
    - kind: DataTable
      id: components_flow_events_concepts_table
      paginated: false
      pagination: false
      rows: '@data/components_flow/events/concepts'
      model:
      - field: concept
        header: '@t/components.flow.table.concept'
        type: str
      - field: api
        header: '@t/components.flow.table.api'
        type: str
      - field: usage
        header: '@t/components.flow.state.table.usage'
        type: str
  - kind: Card
    id: components_flow_events_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
