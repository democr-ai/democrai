- kind: Column
  id: components_media_audio_root
  spacing: 22
  children:
  - kind: Column
    id: components_media_audio_header
    spacing: 8
    children:
    - kind: Title
      id: components_media_audio_eyebrow
      text: '@t/components.media.eyebrow'
      level: 4
    - kind: Title
      id: components_media_audio_title
      text: '@t/components.media.audio.title'
      level: 1
    - kind: Text
      id: components_media_audio_description
      text: '@t/components.media.audio.description'
      muted: true
  - kind: Card
    id: components_media_audio_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_media_audio_preview_title
      text: '@t/components.media.preview.title'
      level: 3
    - kind: Audio
      id: components_media_audio_static
      source: assets/test.mp3
      title: test
      controls: true
      width: 520
      height: 150
    - kind: Text
      id: components_media_audio_preview_note
      text: '@t/components.media.audio.preview.note'
      muted: true
  - kind: Card
    id: components_media_audio_runtime_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 18
    children:
    - kind: Title
      id: components_media_audio_runtime_title
      text: '@t/components.media.runtime.title'
      level: 3
    - kind: Text
      id: components_media_audio_runtime_description
      text: '@t/components.media.audio.runtime.description'
      muted: true
    - kind: Row
      id: components_media_audio_runtime_grid
      spacing: 18
      align: fill
      children:
      - kind: Column
        id: components_media_audio_runtime_left
        spacing: 18
        children:
        - kind: Column
          id: components_media_audio_page_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Audio
            id: components_media_audio_page
            source:
              type: store
              scope: page
              path: /components_media/audio/source
              default: assets/test.mp3
            title:
              type: store
              scope: page
              path: /components_media/audio/title
              default: test
            controls: true
            width: 520
            height: 150
          - kind: Button
            id: components_media_audio_page_button
            label: '@t/components.media.usage.page_store_button'
            variant: default
            action:
              name: components.audio_update
              context:
                mode: page_store
        - kind: Column
          id: components_media_audio_data_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Audio
            id: components_media_audio_data
            source: '@data/components_media/audio_model/source'
            title: '@data/components_media/audio_model/title'
            controls: true
            width: 520
            height: 150
          - kind: Button
            id: components_media_audio_data_button
            label: '@t/components.media.usage.data_button'
            variant: default
            action:
              name: components.audio_update
              context:
                mode: data
      - kind: Column
        id: components_media_audio_runtime_right
        spacing: 18
        children:
        - kind: Column
          id: components_media_audio_global_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Audio
            id: components_media_audio_global
            source:
              type: store
              scope: global
              path: /components_media/audio/source
              default: assets/test.mp3
            title:
              type: store
              scope: global
              path: /components_media/audio/title
              default: test
            controls: true
            width: 520
            height: 150
          - kind: Button
            id: components_media_audio_global_button
            label: '@t/components.media.usage.global_store_button'
            variant: default
            action:
              name: components.audio_update
              context:
                mode: global_store
        - kind: Column
          id: components_media_audio_direct_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Audio
            id: components_media_audio_direct
            source: assets/test.mp3
            title: test
            controls: true
            width: 520
            height: 150
            capabilities:
            - source.set
            - title.set
          - kind: Button
            id: components_media_audio_direct_button
            label: '@t/components.media.usage.direct_button'
            variant: default
            action:
              name: components.audio_update
              context:
                mode: direct
  - kind: Card
    id: components_media_audio_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_media_audio_definition_title
      text: '@t/components.media.definition.title'
      level: 3
    - kind: Row
      id: components_media_audio_definition_grid
      spacing: 16
      align: fill
      children:
      - kind: Markdown
        id: components_media_audio_python_code
        text: |
          ```python
          builder.add(
              sdk.ui.Audio(
                  "notification_sound",
                  source="assets/test.mp3",
                  title="test",
                  controls=True,
                  width=520,
                  height=150,
              )
          )
          ```
      - kind: Markdown
        id: components_media_audio_yaml_code
        text: |
          ```yaml
          - kind: Audio
            id: notification_sound
            source: "assets/test.mp3"
            title: "test"
            controls: true
            width: 520
            height: 150
          ```
  - kind: Card
    id: components_media_audio_binding_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_media_audio_binding_title
      text: '@t/components.media.binding.title'
      level: 3
    - kind: DataTable
      id: components_media_audio_binding_table
      paginated: false
      pagination: false
      total_rows: 4
      rows: '@data/components_media/audio_bindings'
      model:
      - field: binding
        header: '@t/components.media.table.binding'
        type: str
      - field: yaml
        header: '@t/components.media.table.yaml'
        type: str
      - field: source
        header: '@t/components.media.table.source'
        type: str
  - kind: Card
    id: components_media_audio_properties_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_media_audio_properties_title
      text: '@t/components.media.properties.title'
      level: 3
    - kind: DataTable
      id: components_media_audio_properties_table
      paginated: false
      pagination: false
      total_rows: 5
      rows: '@data/components_media/audio_properties'
      model:
      - field: property
        header: '@t/components.media.table.property'
        type: str
      - field: type
        header: '@t/components.media.table.type'
        type: str
      - field: usage
        header: '@t/components.media.table.usage'
        type: str
