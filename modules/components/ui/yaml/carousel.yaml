- kind: Column
  id: components_complex_carousel_root
  spacing: 22
  children:
  - kind: Column
    id: components_complex_carousel_header
    spacing: 8
    children:
    - kind: Title
      id: components_complex_carousel_eyebrow
      text: '@t/components.complex.eyebrow'
      level: 4
    - kind: Title
      id: components_complex_carousel_title
      text: '@t/components.complex.carousel.title'
      level: 1
    - kind: Text
      id: components_complex_carousel_description
      text: '@t/components.complex.carousel.description'
      muted: true
  - kind: Card
    id: components_complex_carousel_preview_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 16
    children:
    - kind: Title
      id: components_complex_carousel_preview_title
      text: '@t/components.complex.preview.title'
      level: 3
    - kind: Row
      id: components_complex_carousel_preview_grid
      spacing: 16
      align: top
      children:
      - kind: Carousel
        id: components_complex_carousel_inline
        autoplay: false
        interval_ms: 3200
        show_dots: true
        show_arrows: true
        loop: true
        data_source:
          type: inline
          data:
          - id: slide_runtime
            eyebrow: Release 2.4
            title: Runtime hardening
            desc: Sandbox checks and stream bindings are ready for review.
            cta: Inspect
          - id: slide_charts
            eyebrow: Telemetry
            title: GPU tracking
            desc: A publisher can push incremental data into chart streams.
            cta: Open stream
          - id: slide_chat
            eyebrow: AI
            title: Component messages
            desc: Chat messages can carry flat component payloads.
            cta: Review
        item_template:
          kind: Card
          id: components_complex_carousel_inline_template
          variant: outlined
          padding:
          - 22
          - 22
          - 22
          - 22
          children:
          - kind: Column
            id: components_complex_carousel_inline_body
            spacing: 10
            children:
            - kind: Text
              id: components_complex_carousel_inline_eyebrow
              text: '{{eyebrow}}'
              muted: true
            - kind: Title
              id: components_complex_carousel_inline_title
              text: '{{title}}'
              level: 3
            - kind: Text
              id: components_complex_carousel_inline_desc
              text: '{{desc}}'
            - kind: Button
              id: components_complex_carousel_inline_cta
              label: '{{cta}}'
              variant: default
              btnsize: sm
              action:
                name: components.carousel_event
                context:
                  source: inline_cta
                  slide_id: '{{id}}'
        on_change:
          name: components.carousel_event
          context:
            source: inline_change
      - kind: Carousel
        id: components_complex_carousel_confirm
        autoplay: false
        show_dots: true
        show_arrows: true
        loop: true
        data_source:
          type: inline
          data:
          - id: confirm_alpha
            eyebrow: Confirm
            title: Alpha slide
            desc: Item clicks ask before dispatch.
            cta: Select
          - id: confirm_beta
            eyebrow: Confirm
            title: Beta slide
            desc: Navigation changes can also be confirmable.
            cta: Select
        item_template:
          kind: Card
          id: components_complex_carousel_confirm_template
          variant: outlined
          padding:
          - 22
          - 22
          - 22
          - 22
          children:
          - kind: Column
            id: components_complex_carousel_confirm_body
            spacing: 10
            children:
            - kind: Text
              id: components_complex_carousel_confirm_eyebrow
              text: '{{eyebrow}}'
              muted: true
            - kind: Title
              id: components_complex_carousel_confirm_title
              text: '{{title}}'
              level: 3
            - kind: Text
              id: components_complex_carousel_confirm_desc
              text: '{{desc}}'
        on_item_click:
          name: components.carousel_event
          context:
            source: confirm_click
            slide_id: '{{id}}'
          confirm:
            text: '@t/components.carousel.confirm.click_prompt'
            confirm_text: '@t/components.carousel.confirm.accept'
            cancel_text: '@t/components.carousel.confirm.cancel'
        on_change:
          name: components.carousel_event
          context:
            source: confirm_change
          confirm:
            text: '@t/components.carousel.confirm.change_prompt'
            confirm_text: '@t/components.carousel.confirm.accept'
            cancel_text: '@t/components.carousel.confirm.cancel'
  - kind: Card
    id: components_complex_carousel_runtime_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 18
    children:
    - kind: Title
      id: components_complex_carousel_runtime_title
      text: '@t/components.complex.runtime.title'
      level: 3
    - kind: Text
      id: components_complex_carousel_runtime_description
      text: '@t/components.complex.carousel.runtime.description'
      muted: true
    - kind: Row
      id: components_complex_carousel_runtime_grid
      spacing: 18
      align: top
      children:
      - kind: Column
        id: components_complex_carousel_runtime_left
        spacing: 16
        children:
        - kind: Column
          id: components_complex_carousel_page_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Carousel
            id: components_complex_carousel_page
            data_source:
              type: binding
              data:
                type: store
                scope: page
                path: /components_complex/carousel/slides
                default: []
            item_template:
              kind: Card
              id: components_complex_carousel_page_template
              variant: outlined
              padding:
              - 18
              - 18
              - 18
              - 18
              children:
              - kind: Column
                id: components_complex_carousel_page_body
                spacing: 8
                children:
                - kind: Text
                  id: components_complex_carousel_page_eyebrow
                  text: '{{eyebrow}}'
                  muted: true
                - kind: Title
                  id: components_complex_carousel_page_title
                  text: '{{title}}'
                  level: 4
                - kind: Text
                  id: components_complex_carousel_page_desc
                  text: '{{desc}}'
            show_dots: true
            show_arrows: true
          - kind: Button
            id: components_complex_carousel_page_button
            label: '@t/components.complex.usage.page_store_button'
            variant: default
            action:
              name: components.carousel_update
              context:
                mode: page_store
        - kind: Column
          id: components_complex_carousel_data_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Carousel
            id: components_complex_carousel_data
            data_source:
              type: binding
              data: '@data/components_complex/carousel_model/slides'
            item_template:
              kind: Card
              id: components_complex_carousel_data_template
              variant: outlined
              padding:
              - 18
              - 18
              - 18
              - 18
              children:
              - kind: Column
                id: components_complex_carousel_data_body
                spacing: 8
                children:
                - kind: Text
                  id: components_complex_carousel_data_eyebrow
                  text: '{{eyebrow}}'
                  muted: true
                - kind: Title
                  id: components_complex_carousel_data_title
                  text: '{{title}}'
                  level: 4
                - kind: Text
                  id: components_complex_carousel_data_desc
                  text: '{{desc}}'
            show_dots: true
            show_arrows: true
          - kind: Button
            id: components_complex_carousel_data_button
            label: '@t/components.complex.usage.data_button'
            variant: default
            action:
              name: components.carousel_update
              context:
                mode: data
      - kind: Column
        id: components_complex_carousel_runtime_right
        spacing: 16
        children:
        - kind: Column
          id: components_complex_carousel_global_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Carousel
            id: components_complex_carousel_global
            data_source:
              type: binding
              data:
                type: store
                scope: global
                path: /components_complex/carousel/slides
                default: []
            item_template:
              kind: Card
              id: components_complex_carousel_global_template
              variant: outlined
              padding:
              - 18
              - 18
              - 18
              - 18
              children:
              - kind: Column
                id: components_complex_carousel_global_body
                spacing: 8
                children:
                - kind: Text
                  id: components_complex_carousel_global_eyebrow
                  text: '{{eyebrow}}'
                  muted: true
                - kind: Title
                  id: components_complex_carousel_global_title
                  text: '{{title}}'
                  level: 4
                - kind: Text
                  id: components_complex_carousel_global_desc
                  text: '{{desc}}'
            show_dots: true
            show_arrows: true
          - kind: Button
            id: components_complex_carousel_global_button
            label: '@t/components.complex.usage.global_store_button'
            variant: default
            action:
              name: components.carousel_update
              context:
                mode: global_store
        - kind: Column
          id: components_complex_carousel_direct_line
          spacing: 10
          style: 'margin-top: 6px; margin-bottom: 10px;'
          children:
          - kind: Carousel
            id: components_complex_carousel_direct
            data_source:
              type: inline
              data:
              - id: direct_alpha
                eyebrow: Direct
                title: Direct alpha
                desc: Initial direct slide.
              - id: direct_beta
                eyebrow: Direct
                title: Direct beta
                desc: Second direct slide.
            item_template:
              kind: Card
              id: components_complex_carousel_direct_template
              variant: outlined
              padding:
              - 18
              - 18
              - 18
              - 18
              children:
              - kind: Column
                id: components_complex_carousel_direct_body
                spacing: 8
                children:
                - kind: Text
                  id: components_complex_carousel_direct_eyebrow
                  text: '{{eyebrow}}'
                  muted: true
                - kind: Title
                  id: components_complex_carousel_direct_title
                  text: '{{title}}'
                  level: 4
                - kind: Text
                  id: components_complex_carousel_direct_desc
                  text: '{{desc}}'
            show_dots: true
            show_arrows: true
            capabilities:
            - dataSource.set
            - dataSource.data.append
            - activeIndex.set
            - autoplay.set
            - intervalMs.set
            - showDots.set
            - showArrows.set
            - loop.set
          - kind: Row
            id: components_complex_carousel_direct_buttons
            spacing: 10
            align: top
            children:
            - kind: Button
              id: components_complex_carousel_direct_button
              label: '@t/components.complex.usage.direct_button'
              variant: default
              action:
                name: components.carousel_update
                context:
                  mode: direct
            - kind: Button
              id: components_complex_carousel_direct_append_button
              label: '@t/components.complex.carousel.append_button'
              variant: default
              action:
                name: components.carousel_update
                context:
                  mode: direct_append
  - kind: Card
    id: components_complex_carousel_definition_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_complex_carousel_definition_title
      text: '@t/components.complex.definition.title'
      level: 3
    - kind: Row
      id: components_complex_carousel_definition_grid
      spacing: 16
      align: fill
      children:
      - kind: Markdown
        id: components_complex_carousel_python_code
        text: '@t/components.complex.carousel.definition.python'
      - kind: Markdown
        id: components_complex_carousel_yaml_code
        text: '@t/components.complex.carousel.definition.yaml'
  - kind: Card
    id: components_complex_carousel_binding_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_complex_carousel_binding_title
      text: '@t/components.complex.binding.title'
      level: 3
    - kind: DataTable
      id: components_complex_carousel_binding_table
      paginated: false
      pagination: false
      rows: '@data/components_complex/carousel_bindings'
      model:
      - field: binding
        header: '@t/components.complex.table.binding'
        type: str
      - field: yaml
        header: '@t/components.complex.table.yaml'
        type: str
      - field: source
        header: '@t/components.complex.table.source'
        type: str
  - kind: Card
    id: components_complex_carousel_properties_card
    variant: outlined
    padding:
    - 20
    - 20
    - 20
    - 20
    spacing: 14
    children:
    - kind: Title
      id: components_complex_carousel_properties_title
      text: '@t/components.complex.properties.title'
      level: 3
    - kind: DataTable
      id: components_complex_carousel_properties_table
      paginated: false
      pagination: false
      rows: '@data/components_complex/carousel_properties'
      model:
      - field: property
        header: '@t/components.complex.table.property'
        type: str
      - field: type
        header: '@t/components.complex.table.type'
        type: str
      - field: usage
        header: '@t/components.complex.table.usage'
        type: str
