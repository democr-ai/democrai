[pytest]
pythonpath = ..
testpaths = .
cache_dir = .pytest_cache
python_files = test_*.py
norecursedirs = docker
markers =
    integration: test di integrazione cross-component (trasporto, auth, request-cycle)
    security_p0: security test prioritari (bloccanti)
    security_p1: security test importanti ma non bloccanti
    sudo_sandbox: test diagnostici reali della sandbox OS/process_guard, richiedono sudo e opt-in esplicito
    linux_only: test che esercitano comportamento dipendente da Linux reale
    macos_only: test che esercitano comportamento dipendente da macOS reale
    windows_only: test che esercitano comportamento dipendente da Windows reale
    posix_only: test che esercitano comportamento POSIX (Unix socket, os.getuid, path POSIX), non Windows
