[package]
name = "democrai-tauri"
version = "0.1.0"
description = "Democrai Tauri desktop wrapper"
authors = ["Democrai"]
edition = "2021"

[lib]
name = "democrai_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
