services:
  client:
    image: httpd:latest
    hostname: apache-app
    container_name: apache-app
    volumes:
      - ../../clients/webclient/dist:/usr/local/apache2/htdocs
    ports:      
      - 8080:80

  redis:
    image: redis:8.4.0-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-democrai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-democrai-secret}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-democrai} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:2025.10.1
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/democrai-neo4j-secret}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" \"RETURN 1;\" || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  minio-media:
    image: minio/minio:latest
    command: minio server /media_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-democrai}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-democrai-minio-secret}
    ports:
      - "${MEDIA_S3_PORT:-9000}:9000"
      - "${MEDIA_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./volumes/minio-media:/media_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  minio-media-init:
    image: minio/mc:latest
    depends_on:
      minio-media:
        condition: service_healthy
    environment:
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-democrai-media}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-democrai}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-democrai-minio-secret}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio-media:9000 "$${MEDIA_S3_ACCESS_KEY}" "$${MEDIA_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${MEDIA_S3_BUCKET}"
        mc anonymous set download "local/$${MEDIA_S3_BUCKET}"
    restart: "no"

  milvus:
    image: milvusdb/milvus:v2.6.2
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
