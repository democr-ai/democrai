app:
  timezone: UTC
  engine_config_encryption_key: local-encryption-key

logging:
  provider: local
  # provider: http
  # url: https://logs.example.com/ingest
  # method: POST

sandbox:
  os:
    enabled: false
    # helper_socket: /tmp/democrai_os_sandbox_helper.sock
    # policy_file: /srv/democrai/data/os_sandbox_allowlist.json
    # observed_file: /srv/democrai/data/os_sandbox_observed_endpoints.json
    refresh_seconds: 60

database:
  type: postgres
  url: postgresql://democrai:democrai-secret@localhost:5432/democrai_core

  data_type: postgres
  data_url: postgresql://democrai:democrai-secret@localhost:5432/democrai_data
  # data_type: supabase
  # data_url: postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres

storage:
  media:
    type: s3
    bucket: democrai-media
    region: us-east-1
    access_key: democrai
    secret_key: democrai-minio-secret
    session_token: ""
    endpoint_url: http://localhost:9000
    public_base_url: http://localhost:9000/democrai-media
    key_prefix: media
    use_path_style: true
    remote_cache:
      ttl_seconds: 3600
  kg:
    type: neo4j
    uri: bolt://localhost:7687
    user: neo4j
    password: democrai-neo4j-secret
  vector:
    type: milvus
    host: localhost
    port: 19530
    user: ""
    password: ""
    # api_key: ${PINECONE_API_KEY}
    # cloud: aws
    # region: us-east-1
    # index_prefix: democrai
  observability:
    type: postgres
    url: postgresql://democrai:democrai-secret@localhost:5432/democrai_observability
    retention:
      events_days: 30
      audit_days: 180
      llm_usage_days: 90
      export_outbox_days: 14
      cleanup_interval_seconds: 3600
    exporters:
      outbox:
        flush_interval_seconds: 30
      otlp:
        enabled: false
        # endpoint: http://otel-collector:4317
        insecure: true
        service_name: democrai

knowledge:
  enabled: true
  embedding:
    # none | hash | openai | ollama
    provider: none
    # model_id: text-embedding-3-small
    # dim: 1536
    # api_key: ${OPENAI_API_KEY}
    # base_url: https://api.openai.com/v1
  vector_index:
    tenant_id: democrai
    app_id: knowledge
    name: items
    dim: 1536
    metric: cosine
  extraction:
    chunk_target_chars: 1200
    chunk_overlap_chars: 150
  retrieval:
    graph_traversal_depth_default: 3
    graph_traversal_depth_ladybug: 2
    graph_traversal_depth_neo4j: 3
    graph_expansion_limit: 12
    graph_score_weight: 0.25
  processing:
    auto_start: true
    batch_size: 32
    lease_seconds: 60
    max_attempts: 12
    poll_interval_seconds: 0.5

network:
  node_id: democrai-node-a
  stream:
    type: redis
    params:
      redis_url: redis://localhost:6379/0
  redis:
    enabled: true
    url: redis://localhost:6379/0
  ws:
    codec: json
    allow_client_codec_override: true

ai:
  engine_orchestrator:
    enabled: true
    transport: tcp
    host: 127.0.0.1
    port: 40151
    startup_timeout_seconds: 30
    invoke_timeout_seconds: 0
    registry_reconcile_seconds: 5
    max_message_mb: 128
    job_terminal_ttl_seconds: 300
    job_output_queue_size: 256
    scheduler_max_queue_depth: 100
    scheduler_submit_timeout_seconds: 0
    scheduler_worker_count: 4
    scheduler_graceful_shutdown_seconds: 30
    batch_wait_seconds: 0.05
    batch_queue_size: 256
    runtime_transition_worker_count: 1
    invocation_worker_count: 4
    provider:
      type: queue
      params: {}
    node_coordination:
      enabled: true
    queue:
      claim_poll_seconds: 2.0
      lease_seconds: 120
      max_attempts: 3
      keepalive_seconds: 10
      retention_seconds: 86400
    placement:
      force_claim_age_seconds: 10
    node_state:
      active_threshold_seconds: 10
      publish_seconds: 2
    response_stream:
      type: redis
      params:
        redis_url: redis://localhost:6379/0
      ttl_seconds: 3600
      maxlen: 10000

plugins:
  # all | trusted_only
  trust_mode: trusted_only
  # In production usually false unless specific user plugins are allowlisted.
  allow_user_plugins: false
  trusted_plugins: []

modules:
  # all | trusted_only
  trust_mode: trusted_only
  # If false, user module directory discovery is skipped.
  allow_user_modules: false
  # Optional additional roots for module discovery/hot-reload.
  # If omitted or empty, only built-in + user module dirs are used.
  # extra_paths:
  #   - /srv/democrai/external-modules
  trusted_modules: []
  sdk_boundary:
    # Recommended in production/distributed: fail-closed dynamic imports in user modules.
    # Blocks dynamic import patterns (importlib.import_module / __import__) unless statically safe.
    fail_closed_dynamic_imports: true

engines:
  # Optional additional roots for engine manifest discovery/hot-reload.
  # If omitted or empty, only built-in `engines/` is used.
  # extra_paths:
  #   - /srv/democrai/external-engines

extractors:
  # Optional additional roots for extractor manifest discovery/hot-reload.
  # If omitted or empty, only built-in `extractors/` is used.
  # extra_paths:
  #   - /srv/democrai/external-extractors

session:
  idle_ttl_seconds: 3600
  cookie_name: democrai_sid
  redis:
    url: redis://localhost:6379/0
  identity:
    provider: redis
  ui_state:
    provider: postgres
    url: postgresql://democrai:democrai-secret@localhost:5432/democrai_ui_state
  cache:
    provider: redis
    ttl_seconds: 300

auth:
  jwt_secret: change-me-with-a-long-random-secret
  jwt_issuer: democrai
  jwt_access_ttl_seconds: 900
  # jwt_audience: democrai-web
  # jwt_tid: tenant-default
  cookie_name: session
  cookie_secure: true
  cookie_http_only: true
  cookie_samesite: lax
  login_rate_limit:
    enabled: true
    username:
      max_failures: 5
      window_seconds: 300
      lockout_seconds: 900
    ip:
      max_failures: 20
      window_seconds: 300
      lockout_seconds: 900

http:
  client_ip:
    # always_trust | trusted_proxy | never
    mode: always_trust
    trusted_proxies: []
  cors:
    enabled: true
    allow_origins:
      - http://localhost:5173
    allow_credentials: true
    allow_methods:
      - "*"
    allow_headers:
      - "*"
