site_name: Democr.ai Plugin Developer Docs
site_description: Documentation for building Democr.ai modules/plugins from zero
site_dir: docs_html/
docs_dir: docs
use_directory_urls: false

theme:
  name: shadcn
  custom_dir: docs/theme_overrides
  favicon: assets/favicon.png
  show_title: true
  show_stargazers: false
  topbar_sections: false
  show_datetime: false
  accent: neutral
  pygments_style:
    light: shadcn-light
    dark: github-dark

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/js/sidebar-nav-fix.js
  - assets/js/code-groups.js
  - assets/js/search-file-fallback.js

plugins:
  - search

hooks:
  - docs/hooks/shiki_build.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true

